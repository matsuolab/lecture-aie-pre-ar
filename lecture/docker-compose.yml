services:
  backend:
    build: ./backend
    # لا يُنشر المنفذ على المضيف.
    # لأن nginx في frontend يمرر الطلبات عبر وكيل عكسي إلى backend:8000
    # ضمن شبكة Docker نفسها, فلا حاجة إلى الوصول المباشر من الخارج.
    # (إبقاء المنفذ منشورًا يُظهر 8000 أيضًا في قائمة منافذ Codespace, مما قد يسبب التباسًا)
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

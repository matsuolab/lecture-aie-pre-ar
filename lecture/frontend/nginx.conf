server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: الرجوع إلى index.html إذا لم يوجد ملف ثابت
    location / {
        try_files $uri $uri/ /index.html;
    }

    # وكيل عكسي إلى backend
    # يكفي أن يرسل المتصفح الطلب دائمًا إلى الأصل الذي يتصل به,
    # دون الحاجة إلى تثبيت اسم مضيف backend أو منفذه في شيفرة الواجهة الأمامية
    location /app/api {
        proxy_pass http://backend:8000/app/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
